<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>עריכת האתר — פשוט ליצור</title>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    /*
      Decap CMS's entry editor hardcodes min-width:800px on its container and
      splits into a 50/50 edit-form / live-preview pane, and each list-item
      row has its own fixed width too — none of it responsive. On a phone
      this pushes the actual form fields (and even the collapsed item
      summary text) off-screen to the right, leaving only an oversized,
      read-only preview visible with no way to reach edit/delete/reorder
      controls. Below 900px this drops the min-width, collapses the split to
      a single full-width pane (hiding the preview), and caps list-item rows
      to 100% width so the whole form — image upload, text fields, expand/
      drag/remove controls — fits and works on a phone screen.
      Injected via JS + MutationObserver (not a plain <style> tag) as a
      defensive measure since Decap re-renders parts of the shell.
    */
    (function () {
      var CSS_TEXT = [
        '@media (max-width: 900px) {',
        '  [class*="EditorContainer"], [class*="-Editor "], [class*="-Editor"] {',
        '    min-width: 0 !important;',
        '    width: 100% !important;',
        '  }',
        '  .SplitPane { position: relative !important; }',
        '  .SplitPane .Pane1 { width: 100% !important; flex: 1 1 100% !important; }',
        '  .SplitPane .Resizer, .SplitPane .Pane2 { display: none !important; }',
        '  .SplitPane .Pane1 [class*="ListItem"] {',
        '    width: 100% !important;',
        '    max-width: 100% !important;',
        '    box-sizing: border-box !important;',
        '  }',
        '}'
      ].join('\n');
      var ID = 'mobile-admin-overrides';

      function ensureStyle() {
        if (document.getElementById(ID)) return;
        var style = document.createElement('style');
        style.id = ID;
        style.textContent = CSS_TEXT;
        document.head.appendChild(style);
      }

      ensureStyle();
      new MutationObserver(ensureStyle).observe(document.head, { childList: true });
    })();
  </script>
</body>
</html>
