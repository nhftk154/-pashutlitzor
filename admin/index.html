<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>עריכת האתר — פשוט ליצור</title>
</head>
<body>
  <!-- עברנו מ-Decap CMS ל-Sveltia CMS (2026-08): אותו config.yml ואותו
       פרוקסי OAuth ממשיכים לעבוד ללא שינוי. בפועל, גם ספריית המדיה
       המובנית של Sveltia (בדיוק כמו של Decap) לא תומכת בבחירה/העלאה
       אמיתית של כמה תמונות בבת אחת — לזה יש כלי נפרד, bulk-images.html
       (ראו הקישור הצף למטה), שכותב ישירות ל-GitHub. -->
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
  <script>
    (function () {
      function addBulkImagesLink() {
        if (document.getElementById('bulk-images-link')) return;
        var a = document.createElement('a');
        a.id = 'bulk-images-link';
        a.href = 'bulk-images.html';
        a.textContent = 'העלאת כמה תמונות בבת אחת';
        a.style.cssText = [
          'position:fixed', 'bottom:16px', 'left:16px', 'z-index:9999',
          'background:#3b6fe0', 'color:#fff', 'padding:10px 16px',
          'border-radius:20px', 'font-family:-apple-system,"Segoe UI",Arial,sans-serif',
          'font-size:13px', 'text-decoration:none', 'box-shadow:0 2px 8px rgba(0,0,0,.3)'
        ].join(';');
        document.body.appendChild(a);
      }
      addBulkImagesLink();
      new MutationObserver(addBulkImagesLink).observe(document.body, { childList: true });
    })();
  </script>
</body>
</html>
