# תצורת ממשק העריכה (Decap CMS) של pashutlitzor.com
#
# base_url: כתובת הפרוקסי (Cloudflare Worker) שמתווך את ההתחברות מול GitHub.
# יש למלא כאן את הכתובת אחרי שמקימים את ה-OAuth App + ה-Worker (ראו README).
# כל עוד זה לא מולא — ההתחברות לא תעבוד לא בפרודקשן ולא מקומית.
#
# לבדיקה מקומית בלי OAuth בכלל: אפשר להחליף זמנית את כל בלוק ה-backend ב-
#   backend: { name: proxy, proxy_url: http://localhost:8081/api/v1, branch: main }
# ולהריץ `npx decap-server` — עוקף לגמרי את ההתחברות (לשימוש מקומי בלבד,
# לא לשמור/לדחוף שינוי כזה).
backend:
  name: github
  repo: nhftk154/-pashutlitzor
  branch: main
  base_url: https://pashutlitzor-cms-auth.nhftk154.workers.dev
  auth_endpoint: auth

local_backend: true

site_url: https://pashutlitzor.com
display_url: https://pashutlitzor.com
logo_url: /assets/branding/logo-removebg-preview.png
locale: "he"

media_folder: "assets/gallery"
public_folder: "/assets/gallery"

collections:
  - name: "gallery"
    label: "תמונות גלריה"
    files:
      - name: "gallery"
        label: "תמונות גלריה"
        file: "content/gallery.json"
        fields:
          - label: "תמונות"
            name: "items"
            widget: "list"
            label_singular: "תמונה"
            summary: "{{fields.alt}}"
            fields:
              - label: "תמונה"
                name: "src"
                widget: "image"
                media_folder: "/assets/gallery"
                public_folder: "/assets/gallery"
              - label: "תיאור קצר של התמונה"
                name: "alt"
                widget: "string"
                hint: "משפט קצר שמתאר מה רואים בתמונה"

  - name: "testimonials"
    label: "המלצות לקוחות"
    files:
      - name: "testimonials"
        label: "המלצות לקוחות"
        file: "content/testimonials.json"
        fields:
          - label: "המלצות"
            name: "items"
            widget: "list"
            label_singular: "המלצה"
            summary: "{{fields.name}}"
            fields:
              - label: "תוכן ההמלצה"
                name: "quote"
                widget: "text"
              - label: "שם הלקוחה / הלקוח"
                name: "name"
                widget: "string"
              - label: "פרטים נוספים (סוג סדנה, תפקיד וכו')"
                name: "meta"
                widget: "string"
                required: false

  - name: "corporate"
    label: "תמונת אירוע חברה"
    files:
      - name: "corporate"
        label: "תמונת אירוע חברה"
        file: "content/corporate.json"
        fields:
          - label: "תמונה"
            name: "src"
            widget: "image"
            media_folder: "/assets"
            public_folder: "/assets"
          - label: "תיאור קצר של התמונה"
            name: "alt"
            widget: "string"

  - name: "workshops"
    label: "כרטיסי סדנאות"
    files:
      - name: "workshops"
        label: "כרטיסי סדנאות"
        file: "content/workshops.json"
        fields:
          - label: "כרטיסים"
            name: "items"
            widget: "list"
            label_singular: "כרטיס"
            summary: "{{fields.title}}"
            fields:
              - label: "כותרת"
                name: "title"
                widget: "string"
              - label: "תיאור (אפשר לציין כאן גם מחיר/תאריכים אם רוצים)"
                name: "description"
                widget: "text"
              - label: "סוג אייקון"
                name: "icon"
                widget: "select"
                options:
                  - { label: "סדנה פרטית", value: "private" }
                  - { label: "ערב בנות", value: "social" }
                  - { label: "חגיגה קבוצתית", value: "party" }
                  - { label: "אירוע חברה", value: "corporate" }
              - label: "הודעת וואטסאפ מוכנה מראש"
                name: "waText"
                widget: "string"
                hint: "הטקסט שיופיע אוטומטית בהודעה כשלוחצים על 'לפרטים'"

  - name: "videos"
    label: "סרטוני סדנאות"
    files:
      - name: "videos"
        label: "סרטוני סדנאות"
        file: "content/videos.json"
        fields:
          - label: "סרטונים"
            name: "items"
            widget: "list"
            label_singular: "סרטון"
            summary: "{{fields.title}}"
            types:
              - name: "youtube"
                label: "סרטון מיוטיוב"
                widget: "object"
                summary: "{{fields.title}} (יוטיוב)"
                fields:
                  - { label: "כותרת קצרה לסרטון", name: "title", widget: "string", required: false }
                  - label: "קישור YouTube"
                    name: "youtube_url"
                    widget: "string"
                    hint: "הדביקו כאן את הקישור לסרטון מיוטיוב (למשל https://www.youtube.com/watch?v=...)"
                  - label: "תמונה ממוזערת (אופציונלי)"
                    name: "poster"
                    widget: "image"
                    required: false
                    media_folder: "/assets/videos"
                    public_folder: "/assets/videos"
                    hint: "אם לא תעלו תמונה — תוצג אוטומטית תמונה מיוטיוב"
                  - label: "כיוון הסרטון"
                    name: "aspect"
                    widget: "select"
                    default: "landscape"
                    options:
                      - { label: "לרוחב", value: "landscape" }
                      - { label: "לאורך (טלפון)", value: "portrait" }
                      - { label: "מרובע", value: "square" }
              - name: "file"
                label: "סרטון שהעליתי בעצמי"
                widget: "object"
                summary: "{{fields.title}} (קובץ)"
                fields:
                  - { label: "כותרת קצרה לסרטון", name: "title", widget: "string", required: false }
                  - label: "קובץ הסרטון"
                    name: "file_src"
                    widget: "file"
                    media_folder: "/assets/videos"
                    public_folder: "/assets/videos"
                    hint: "העלו כאן את קובץ הסרטון (mp4 מומלץ)"
                  - label: "תמונה ממוזערת (חובה)"
                    name: "poster"
                    widget: "image"
                    media_folder: "/assets/videos"
                    public_folder: "/assets/videos"
                    hint: "תמונת שער שתוצג לפני הפעלת הסרטון"
                  - label: "כיוון הסרטון"
                    name: "aspect"
                    widget: "select"
                    default: "portrait"
                    options:
                      - { label: "לרוחב", value: "landscape" }
                      - { label: "לאורך (טלפון)", value: "portrait" }
                      - { label: "מרובע", value: "square" }

  - name: "products"
    label: "מוצרים לחנות"
    files:
      - name: "products"
        label: "מוצרים לחנות"
        file: "content/products.json"
        fields:
          - label: "מוצרים"
            name: "items"
            widget: "list"
            label_singular: "מוצר"
            summary: "{{fields.name}}"
            fields:
              - { label: "שם המוצר", name: "name", widget: "string" }
              - { label: "מזהה URL (באנגלית, ללא רווחים, למשל vase-terracotta-round)", name: "slug", widget: "string" }
              - label: "סוג מוצר"
                name: "type"
                widget: "select"
                options:
                  - { label: "קיט DIY", value: "kit" }
                  - { label: "מוצר מוגמר", value: "finished" }
              - { label: "קטגוריה", name: "category", widget: "string", hint: "לדוגמה: אגרטלים, מגשים, קיטים — אפשר להקליד קטגוריה חדשה" }
              - { label: "תיאור קצר (לכרטיס המוצר)", name: "shortDescription", widget: "string" }
              - { label: "תיאור מלא (לעמוד המוצר)", name: "description", widget: "text" }
              - { label: "איך להשתמש (בעיקר לקיטים)", name: "howToUse", widget: "text", required: false }
              - { label: "משלוח / איסוף", name: "delivery", widget: "text" }
              - label: "תמונות"
                name: "images"
                widget: "list"
                label_singular: "תמונה"
                field: { label: "תמונה", name: "src", widget: "image", media_folder: "/assets/shop", public_folder: "/assets/shop" }
              - label: "תגיות (אופציונלי)"
                name: "badges"
                widget: "select"
                multiple: true
                required: false
                options:
                  - { label: "רב מכר", value: "bestseller" }
                  - { label: "חדש", value: "new" }
                  - { label: "מבצע", value: "sale" }
              - { label: "מחיר בסיס בשקלים (למשל 129.00)", name: "priceIls", widget: "number", value_type: "float" }
              - label: "וריאציות (גדלים/צבעים — השאירי ריק אם למוצר אין וריאציות)"
                name: "variants"
                widget: "list"
                required: false
                label_singular: "וריאציה"
                summary: "{{fields.label}}"
                fields:
                  - { label: "תווית (למשל: מגש גדול)", name: "label", widget: "string" }
                  - { label: "מק״ט", name: "sku", widget: "string" }
                  - { label: "מחיר בשקלים", name: "priceIls", widget: "number", value_type: "float" }
              - { label: "פעיל (מוצג בחנות)", name: "active", widget: "boolean", default: true }

  - name: "site-text"
    label: "טקסטים כלליים באתר"
    files:
      - name: "site-text"
        label: "טקסטים כלליים באתר"
        file: "content/site-text.json"
        fields:
          - label: "תפריט ניווט עליון"
            name: "nav"
            widget: "object"
            fields:
              - { label: "קישור 1", name: "concept", widget: "string" }
              - { label: "קישור 2", name: "workshops", widget: "string" }
              - { label: "קישור 3", name: "gallery", widget: "string" }
              - { label: "קישור 4", name: "videos", widget: "string" }
              - { label: "קישור 5", name: "corporate", widget: "string" }

          - label: "מסך פתיחה (למעלה)"
            name: "hero"
            widget: "object"
            fields:
              - { label: "תווית קטנה מעל הכותרת", name: "eyebrow", widget: "string" }
              - { label: "כותרת ראשית — שורה 1", name: "headingLine1", widget: "string" }
              - { label: "כותרת ראשית — שורה 2 (מודגשת בצבע)", name: "headingAccent", widget: "string" }
              - { label: "משפט משנה 1", name: "sub1", widget: "string" }
              - { label: "משפט משנה 2", name: "sub2", widget: "text" }
              - { label: "טקסט כפתור וואטסאפ", name: "ctaWhatsapp", widget: "string" }
              - { label: "טקסט כפתור משני", name: "ctaSecondary", widget: "string" }

          - label: "מקטע 'גבס פולימרי' (מה זה)"
            name: "concept"
            widget: "object"
            fields:
              - { label: "תווית קטנה", name: "eyebrow", widget: "string" }
              - { label: "כותרת", name: "heading", widget: "string" }
              - { label: "פסקת פתיחה", name: "intro", widget: "text" }
              - label: "נקודות (כל אחת: כותרת קצרה מודגשת + הסבר)"
                name: "points"
                widget: "list"
                label_singular: "נקודה"
                summary: "{{fields.title}}"
                fields:
                  - { label: "כותרת קצרה", name: "title", widget: "string" }
                  - { label: "הסבר", name: "description", widget: "text" }

          - label: "מקטע סדנאות — כותרת עליונה"
            name: "workshopsHead"
            widget: "object"
            fields:
              - { label: "תווית קטנה", name: "eyebrow", widget: "string" }
              - { label: "כותרת", name: "heading", widget: "string" }
              - { label: "טקסט הסבר", name: "text", widget: "text" }

          - label: "מקטע גלריה — כותרת עליונה"
            name: "galleryHead"
            widget: "object"
            fields:
              - { label: "תווית קטנה", name: "eyebrow", widget: "string" }
              - { label: "כותרת", name: "heading", widget: "string" }
              - { label: "טקסט הסבר", name: "text", widget: "text" }

          - label: "מקטע סרטונים — כותרת עליונה"
            name: "videosHead"
            widget: "object"
            fields:
              - { label: "תווית קטנה", name: "eyebrow", widget: "string" }
              - { label: "כותרת", name: "heading", widget: "string" }
              - { label: "טקסט הסבר", name: "text", widget: "text" }

          - label: "מקטע לחברות וארגונים"
            name: "corporate"
            widget: "object"
            fields:
              - { label: "תווית קטנה", name: "eyebrow", widget: "string" }
              - { label: "כותרת", name: "heading", widget: "string" }
              - { label: "פסקת פתיחה", name: "lead", widget: "text" }
              - label: "מספרים (סטטיסטיקות)"
                name: "stats"
                widget: "list"
                label_singular: "מספר"
                summary: "{{fields.number}} — {{fields.label}}"
                fields:
                  - { label: "מספר / ערך", name: "number", widget: "string" }
                  - { label: "תיאור מתחת למספר", name: "label", widget: "string" }
              - label: "יתרונות (עם וי ירוק)"
                name: "features"
                widget: "list"
                label_singular: "יתרון"
                summary: "{{fields.title}}"
                fields:
                  - { label: "כותרת קצרה", name: "title", widget: "string" }
                  - { label: "הסבר", name: "description", widget: "text" }
              - { label: "טקסט כפתור וואטסאפ", name: "ctaText", widget: "string" }

          - label: "מקטע המלצות — כותרת עליונה"
            name: "testimonialsHead"
            widget: "object"
            fields:
              - { label: "תווית קטנה", name: "eyebrow", widget: "string" }
              - { label: "כותרת", name: "heading", widget: "string" }

          - label: "מקטע סיום (קריאה לפעולה)"
            name: "contact"
            widget: "object"
            fields:
              - { label: "תווית קטנה", name: "eyebrow", widget: "string" }
              - { label: "כותרת", name: "heading", widget: "string" }
              - { label: "משפט הסבר", name: "sub", widget: "text" }
              - { label: "טקסט כפתור וואטסאפ", name: "ctaWhatsapp", widget: "string" }
              - { label: "טקסט כפתור אינסטגרם", name: "ctaInstagram", widget: "string" }
              - { label: "טקסט כפתור פייסבוק", name: "ctaFacebook", widget: "string" }
              - { label: "שורת טלפון וזמינות", name: "note", widget: "string" }

          - label: "פוטר (תחתית העמוד)"
            name: "footer"
            widget: "object"
            fields:
              - { label: "שם המותג", name: "brand", widget: "string" }
              - { label: "טקסט זכויות יוצרים", name: "rights", widget: "string" }
