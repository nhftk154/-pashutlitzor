name = "pashutlitzor-shop"
main = "worker.js"
compatibility_date = "2024-01-01"

# אחרי `wrangler d1 create pashutlitzor-orders` יש להדביק כאן את ה-database_id שמתקבל.
[[d1_databases]]
binding = "ORDERS_DB"
database_name = "pashutlitzor-orders"
database_id = ""

# אחרי הפריסה (wrangler deploy) יש להגדיר את הסודות הבאים:
#   wrangler secret put GROW_USER_ID       (מתקבל מ-Grow/משולם אחרי פתיחת חשבון + בקשת גישת API)
#   wrangler secret put GROW_PAGE_CODE     (מתקבל מ-Grow/משולם)
#   wrangler secret put GROW_API_KEY       (רק אם רלוונטי לסוג החשבון — לוודא מול Grow)
#   wrangler secret put RESEND_API_KEY
#
# ⚠️ לפני production: יש להשלים את כל ה-TODO-ים ב-worker.js, ובפרט את אימות
# ה-callback מ-Grow (חתימה/סוד משותף) — בלי זה אפשר לזייף "הזמנה שולמה".
